# Xaero-rs: Xaero's Minimap + World Map as one Horizon native mod.
[mod]
id = "xaero_rs"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "umbx_xaero"
source = "runtime.rs"

[[crate]]
id = "engine"
path = "engine"
# package xaero-rs-engine; helpers call it as xaero_rs_engine::

# --- hook shims (one bare fn each, pasted into the hooked function) ---

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "hooks/key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "hooks/frame.rs"
bindings = [
